# NOT ENABLED. Dependabot starts as soon as this file is at .github/dependabot.yml — move it there
# to switch it on (docs/STATIC_ANALYSIS.md). Grouped and weekly, so it is a PR or two a week, not
# one per package. Expo SDK packages move together with `npx expo install --fix`, not one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          [
            'expo',
            'expo-*',
            '@expo/*',
            'react-native',
            'react-native-*',
            '@react-native/*',
            'react',
            'react-dom',
          ]
      dev-tools:
        dependency-type: development
    ignore:
      # Major versions of the SDK stack are an upgrade project, not a Dependabot PR.
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

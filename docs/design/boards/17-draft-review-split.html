<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Draft review split</title>
<script src="4d179f0c-64f8-478c-9816-05f75c78b44a"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4C5BD4}a:hover{color:#3A48B8}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box;border:0;background:transparent;font:inherit;text-align:left;color:#14151A}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-val{font-size:15px;color:#6B6F76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.k-sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#6B6F76;padding:0 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.k-sh a{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;text-decoration:none}
.k-seg{display:flex;background:#EAEAE6;border-radius:10px;padding:2px}
.k-seg button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#6B6F76}
.k-seg button.on{background:#fff;color:#14151A;box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #3A3A3C; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="position: absolute; left: 16px; right: 16px; top: 46px; height: 30px; border-radius: 12px 12px 0 0; background: #8E8E93"></div>
  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #F5F5F3; border-radius: 14px 14px 0 0; display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; gap: 4px">
      <button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg/></button>
      <span style="flex: 1; font-size: 17px; font-weight: 600">Review</span>
      <button aria-label="More" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg/></button>
    </div>

    <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 16px">
      <div class="k-seg" role="group" aria-label="Type"><button class="on" aria-pressed="true">Expense</button><button>Income</button><button>Transfer</button></div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span class="k-sub">Total</span>
        <button style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 40px; line-height: 46px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; color: #14151A">84,37 <span style="color: #6B6F76; font-weight: 600">zł</span></button>
        <button style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 17px; font-weight: 600; color: #14151A">Lidl</button>
      </div>

      <div role="tablist" aria-label="Parts" style="display: flex; gap: 6px">
        <button role="tab" aria-selected="true" style="flex: 1; height: 44px; border-radius: 12px; border: 2px solid #4C5BD4; background: #E7E9FB; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #3A48B8"><span style="font-size: 12px; font-weight: 600">Part 1</span><span style="font-size: 13px; font-variant-numeric: tabular-nums">64,37</span></button>
        <button role="tab" aria-selected="false" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #E3E3DF; background: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #14151A"><span style="font-size: 12px; font-weight: 600; color: #6B6F76">Part 2</span><span style="font-size: 13px; font-variant-numeric: tabular-nums">20,00</span></button>
      </div>

      <div>
        <div class="k-sh"><span>Part 1 of 2</span><a href="#" style="color: #C2413A">Remove</a></div>
        <div class="k-grp">
          <button class="k-row"><span class="k-lbl">Amount</span><span class="k-val" style="color: #14151A; font-weight: 600">64,37 zł</span><svg/></button>
          <button class="k-row"><span class="k-lbl">Title</span><span class="k-val">Groceries</span><svg/></button>
          <button class="k-row"><span class="k-lbl">Category</span><span class="k-val">Groceries</span><svg/></button>
          <button class="k-row"><span class="k-lbl">Budget</span><span class="k-val">Food · 204,55 left</span><svg/></button>
          <button class="k-row"><span class="k-lbl">Details</span><span class="k-val">Note, tags, shared with</span><svg/></button>
        </div>
        <div class="k-sub" style="padding: 4px 4px 0">Payee, account and date are shared by every part.</div>
      </div>
    </div>

    <div style="border-top: 1px solid #E3E3DF; padding: 12px 16px 34px; background: #F5F5F3; display: flex; gap: 8px">
      <button style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: #EAEAE6; color: #14151A; font: inherit; font-size: 17px; font-weight: 600">Add part</button>
      <button style="flex: 2; height: 52px; border: 0; border-radius: 14px; background: #4C5BD4; color: #fff; font: inherit; font-size: 17px; font-weight: 600">Confirm</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

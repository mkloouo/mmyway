<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>New loan or debt</title>
<script src="cce3852a-27ca-449d-a287-b3e962e3efcc"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4C5BD4}a:hover{color:#3A48B8}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-btnrow{width:100%;border:0;background:transparent;font:inherit;text-align:left;color:#14151A;cursor:pointer}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-val{font-size:15px;color:#6B6F76;white-space:nowrap}
.k-sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#6B6F76;padding:18px 4px 8px}
.k-ibtn{width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.k-txtbtn{border:0;background:transparent;padding:6px 0;font:inherit;font-size:13px;font-weight:600;color:#4C5BD4;cursor:pointer}
.k-in{border:0;background:transparent;font:inherit;font-size:15px;color:#14151A;text-align:right;outline:none;padding:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-in::placeholder{color:#9AA0A6}
.k-chev{flex:none}
</style>
</helmet>
<div style="width: 390px; height: 900px; background: #3A3A3C; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="position: absolute; left: 16px; right: 16px; top: 46px; height: 30px; border-radius: 12px 12px 0 0; background: #8E8E93"></div>
  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #F5F5F3; border-radius: 14px 14px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; gap: 4px">
      <button class="k-ibtn" aria-label="Close"><svg/></button>
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">New loan or debt</span><span class="k-sub">Step 2 of 2</span></div>
    </div>

    <div style="padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span class="k-sub">Car loan · Loan · I owe this · PLN</span>
      <button class="k-txtbtn">Change</button>
    </div>

    <div style="padding: 0 16px; flex: 1; overflow: hidden; display: flex; flex-direction: column">
      <div class="k-sh">Balance today</div>
      <div class="k-grp">
        <div class="k-row"><span class="k-lbl">Amount</span><input class="k-in" value="38.500,00 zł" inputmode="decimal" aria-label="Amount" style="width: 150px"></div>
        <button class="k-row k-btnrow"><span class="k-lbl">As of</span><span class="k-val" style="color: #14151A">Oct 12, 2026</span><svg/></button>
      </div>

      <div class="k-sh">Interest</div>
      <div class="k-grp">
        <div class="k-row"><span class="k-lbl">Rate</span><input class="k-in" value="7,9 %" inputmode="decimal" aria-label="Rate" style="width: 90px"></div>
        <button class="k-row k-btnrow"><span class="k-lbl">Charged</span><span class="k-val" style="color: #14151A">Monthly</span><svg/></button>
      </div>

      <div class="k-sh">Limit (optional)</div>
      <div class="k-grp">
        <div class="k-row"><span class="k-lbl">Credit limit</span><input class="k-in" placeholder="None" inputmode="decimal" aria-label="Credit limit" style="width: 150px"></div>
      </div>

      <div class="k-sub" style="padding: 8px 4px 0">You can change all of this later in the account's page.</div>
    </div>

    <div style="border-top: 1px solid #E3E3DF; padding: 12px 16px 34px; background: #F5F5F3">
      <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #4C5BD4; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600">Create loan or debt</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

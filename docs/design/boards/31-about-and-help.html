<helmet>
<style>
body{margin:0}
a{color:#4C5BD4}a:hover{color:#3A48B8}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box}

.k-lbl{font-size:15px;line-height:20px;color:#14151A}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-val{font-size:15px;color:#6B6F76;white-space:nowrap}
.k-sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#6B6F76;padding:22px 20px 8px}
.k-stack{flex:1;min-width:0;display:flex;flex-direction:column;padding:11px 0}
.k-radio{width:22px;height:22px;border-radius:50%;border:2px solid #C9C9C4;box-sizing:border-box;flex:none;align-self:flex-start;margin-top:13px}
.k-radio.on{border:7px solid #4C5BD4}
.k-chev{flex:none}
</style>
</helmet>
<div style="width: 390px; height: 900px; background: #F5F5F3; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; height: 44px; padding: 0 8px">

  </div>

  <div class="k-sh">This app</div>
  <div style="padding: 0 16px">
    <div class="k-grp">
      <div class="k-row"><span class="k-lbl" style="flex: 1">Version</span><span class="k-val">1.8.0 (204)</span></div>

      <button class="k-row" style="width: 100%; border: none; background: #FFFFFF; font: inherit; font-size: 15px; color: #C2413A; text-align: left; cursor: pointer">Clear the log</button>
    </div>
    <div class="k-sub" style="padding: 8px 4px 0">The log stays on this phone. Share it only with someone helping you fix a problem.</div>
  </div>

  <div class="k-sh">Firefly III</div>
  <div style="padding: 0 16px">
    <div class="k-grp">

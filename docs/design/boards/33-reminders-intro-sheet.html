<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Reminders intro sheet</title>
<script src="82551129-d755-41b7-9f3f-066587b1bd26"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.k-x{width:32px;height:32px;border-radius:50%;background:#E8E8E4;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.k-opt{flex:1;border:1px solid #E3E3DF;background:#fff;border-radius:14px;padding:12px 10px;font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px}
.k-opt.on{border:2px solid #4C5BD4;background:#E7E9FB;padding:11px 9px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F5F3; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 34px; font-weight: 700">Planned</div>
    <div style="height: 36px; border-radius: 10px; background: #EAEAE6"></div>
    <div style="height: 76px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
    <div style="height: 120px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.40)"></div>

  <div role="dialog" aria-label="Turn on reminders" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F5F3; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9C9C4; margin: 8px auto 0"></div>
    <div style="display: flex; justify-content: flex-end; padding: 8px 16px 0">
      <button class="k-x" aria-label="Not now"><svg/></button>
    </div>

    <div style="padding: 0 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: #E7E9FB; display: flex; align-items: center; justify-content: center"><svg/></div>
      <div style="font-size: 22px; line-height: 28px; font-weight: 700">Want a heads-up before Rent goes out?</div>
      <div style="font-size: 15px; line-height: 21px; color: #6B6F76">We'll tell you ahead of time, and warn you if Checking doesn't have enough.</div>
    </div>

    <div style="padding: 18px 16px 0">
      <div style="background: #1C1D22; border-radius: 18px; padding: 12px">
        <div style="background: rgba(255,255,255,.92); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: #4C5BD4; flex: none; display: flex; align-items: center; justify-content: center"><svg/></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left">
            <div style="display: flex; justify-content: space-between"><span style="font-size: 13px; font-weight: 600">Rent goes out tomorrow</span><span style="font-size: 12px; color: #6B6F76">9:00</span></div>
            <span style="font-size: 13px; line-height: 17px">2.400,00 zł from Checking. There's enough in it.</span>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #6B6F76; padding: 0 4px">Remind me</span>
      <div style="display: flex; gap: 8px" role="radiogroup" aria-label="Remind me">
        <button class="k-opt" role="radio" aria-checked="false"><span style="font-size: 15px; font-weight: 600">On the day</span><span style="font-size: 12px; color: #6B6F76">at 9:00</span></button>
        <button class="k-opt on" role="radio" aria-checked="true"><span style="font-size: 15px; font-weight: 600">Day before</span><span style="font-size: 12px; color: #3A48B8">at 9:00</span></button>
        <button class="k-opt" role="radio" aria-checked="false"><span style="font-size: 15px; font-weight: 600">Week before</span><span style="font-size: 12px; color: #6B6F76">at 9:00</span></button>
      </div>
    </div>

    <div style="padding: 20px 16px 34px; display: flex; flex-direction: column; gap: 4px">
      <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #4C5BD4; color: #fff; font: inherit; font-size: 17px; font-weight: 600">Turn on reminders</button>
      <button style="width: 100%; height: 44px; border: 0; background: transparent; color: #6B6F76; font: inherit; font-size: 15px; font-weight: 600">Not now</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

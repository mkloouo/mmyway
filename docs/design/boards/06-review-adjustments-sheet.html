<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Review adjustments sheet</title>
<script src="60e120b3-cfc0-4245-90d6-6d1ac6728bff"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-val{font-size:15px;color:#14151A;white-space:nowrap}
.k-amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#6B6F76;padding:16px 4px 8px}
.k-x{width:32px;height:32px;border-radius:50%;background:#E8E8E4;border:0;display:flex;align-items:center;justify-content:center;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #3A3A3C; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #F5F5F3; border-radius: 14px 14px 0 0; padding: 70px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 300px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
    <div style="height: 104px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.40)"></div>

  <div role="dialog" aria-label="Review adjustments" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F5F3; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9C9C4; margin: 8px auto 0"></div>
    <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; gap: 12px">
      <span style="flex: 1; font-size: 17px; font-weight: 600">Review adjustments</span>
      <button class="k-x" aria-label="Close"><svg/></button>
    </div>
    <div style="padding: 0 16px 16px; display: flex; flex-direction: column">
      <div class="k-grp">
        <div class="k-row">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #FDF0DC; display: flex; align-items: center; justify-content: center; flex: none"><svg/></div>
          <div style="flex: 1; display: flex; flex-direction: column; padding: 10px 0"><span class="k-lbl">Cash wallet</span><span class="k-sub">Counted 468,00 · expected 485,00</span></div>
          <span class="k-amt" style="color: #B45309">−17,00 zł</span>
        </div>
      </div>

      <div class="k-sh">Booked as</div>
      <div class="k-grp">
        <div class="k-row"><div style="flex: 1; display: flex; flex-direction: column; padding: 10px 0"><span class="k-lbl">Missing cash goes to</span><span class="k-sub">Expense account</span></div><span class="k-val">Cash shortfall</span><svg/></div>
        <div class="k-row"><div style="flex: 1; display: flex; flex-direction: column; padding: 10px 0"><span class="k-lbl">Extra cash comes from</span><span class="k-sub">Revenue account</span></div><span class="k-val">Cash surplus</span><svg/></div>
        <div class="k-row"><span class="k-lbl">Category</span><span class="k-val" style="color: #6B6F76">None</span><svg/></div>
      </div>
      <div class="k-sub" style="padding: 8px 4px 0">Each envelope that is off gets one transaction, dated now, that brings it to what you counted.</div>
    </div>
    <div style="border-top: 1px solid #E3E3DF; padding: 12px 16px 34px">
      <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #4C5BD4; color: #fff; font: inherit; font-size: 17px; font-weight: 600">Confirm 1 adjustment</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

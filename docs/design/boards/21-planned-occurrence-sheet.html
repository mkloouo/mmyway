<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Planned occurrence sheet</title>
<script src="15afb92c-b999-440d-9989-3b7e0a5a23c6"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-val{font-size:15px;color:#14151A;white-space:nowrap}
.k-x{width:32px;height:32px;border-radius:50%;background:#E8E8E4;border:0;display:flex;align-items:center;justify-content:center;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F5F3; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 34px; font-weight: 700">Planned</div>
    <div style="height: 36px; border-radius: 10px; background: #EAEAE6"></div>
    <div style="height: 76px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
    <div style="height: 120px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
    <div style="height: 170px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.40)"></div>

  <div role="dialog" aria-label="Rent on Thursday, October 15" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F5F3; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9C9C4; margin: 8px auto 0"></div>
    <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Rent</span><span class="k-sub">Thu, Oct 15 · in 3 days</span></div>
      <button class="k-x" aria-label="Close"><svg/></button>
    </div>
    <div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 34px; line-height: 40px; font-weight: 700; padding: 0 4px; font-variant-numeric: tabular-nums">−2.400,00 <span style="color: #6B6F76; font-weight: 600">zł</span></div>
      <div class="k-grp">
        <div class="k-row"><span class="k-lbl">From</span><span class="k-val">Checking</span></div>
        <div class="k-row"><span class="k-lbl">To</span><span class="k-val">Landlord</span></div>
        <div class="k-row"><span class="k-lbl">Category</span><span class="k-val">Housing</span></div>
      </div>
      <div class="k-grp">
        <a href="PlannedItem.dc.html" class="k-row" style="text-decoration: none"><div style="flex: 1; display: flex; flex-direction: column; padding: 10px 0"><span class="k-lbl">Edit the plan</span><span class="k-sub">Monthly on the 15th</span></div><svg/></a>
      </div>
    </div>
    <div style="border-top: 1px solid #E3E3DF; padding: 12px 16px 34px; display: flex; gap: 10px">
      <button style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: #EAEAE6; color: #14151A; font: inherit; font-size: 17px; font-weight: 600">Skip this one</button>
      <button style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: #4C5BD4; color: #fff; font: inherit; font-size: 17px; font-weight: 600">Book it now</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

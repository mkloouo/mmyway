<style>
body{margin:0}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 0 0 14px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:#E3E3DF}
.k-key{width:58px;flex:none;font-size:13px;color:#6B6F76}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-chips{flex:1;min-width:0;display:flex;gap:6px;overflow:hidden;padding-right:4px}
.k-c{height:32px;padding:0 12px;border-radius:999px;border:1px solid #E3E3DF;background:#fff;font:inherit;font-size:14px;color:#14151A;white-space:nowrap;flex:none}
.k-c.on{background:#4C5BD4;border-color:#4C5BD4;color:#fff;font-weight:600}
.k-find{width:44px;height:48px;border:0;border-left:1px solid #E3E3DF;background:transparent;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.k-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.k-pad button{height:44px;border:0;border-radius:12px;background:#fff;font:inherit;font-size:22px;font-weight:500;color:#14151A}
.k-seg{display:flex;background:#EAEAE6;border-radius:10px;padding:2px;flex:1}
.k-seg button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#6B6F76}
.k-seg button.on{background:#fff;color:#14151A;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.k-pill{height:30px;padding:0 10px;border-radius:999px;border:0;background:#EAEAE6;font:inherit;font-size:13px;font-weight:600;color:#14151A;display:flex;align-items:center;gap:4px}
</style>

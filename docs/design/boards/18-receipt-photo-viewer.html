<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Receipt photo viewer</title>
<script src="258a109a-2565-44e2-a61c-b12e484f7e1f"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0B0D; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 44px 8px 0">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg/></button>
    <span style="flex: 1; font-size: 17px; font-weight: 600">Receipt</span>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 28px">
    <div role="img" aria-label="Receipt photo" style="width: 100%; height: 560px; background: #F2EFE8; border-radius: 4px; padding: 28px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; color: #3A3A3C; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px">
      <div style="text-align: center; font-weight: 700; font-size: 14px">[STORE NAME]</div>
      <div style="height: 1px; background: #CFCAC0; margin: 6px 0"></div>
      <div style="height: 8px; width: 80%; background: #D9D4CA; border-radius: 2px"></div>
      <div style="height: 8px; width: 65%; background: #D9D4CA; border-radius: 2px"></div>
      <div style="height: 8px; width: 72%; background: #D9D4CA; border-radius: 2px"></div>
      <div style="height: 8px; width: 58%; background: #D9D4CA; border-radius: 2px"></div>
      <div style="height: 8px; width: 76%; background: #D9D4CA; border-radius: 2px"></div>
      <div style="height: 8px; width: 61%; background: #D9D4CA; border-radius: 2px"></div>
      <div style="flex: 1"></div>
      <div style="height: 1px; background: #CFCAC0"></div>
      <div style="display: flex; justify-content: space-between; font-weight: 700"><span>SUMA</span><span>84,37</span></div>
    </div>
  </div>

  <div style="display: flex; padding: 0 16px 34px">
    <button style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.12); color: #FF8A80; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg/>Remove photo</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

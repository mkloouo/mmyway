<style>
body{margin:0}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}

.k-stack{flex:1;min-width:0;display:flex;flex-direction:column;padding:9px 0}
.k-sw{width:51px;height:31px;border-radius:999px;background:#4C5BD4;position:relative;flex:none;border:0;padding:0}
.k-sw::after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.k-kind{flex:1;border:1px solid #E3E3DF;background:#fff;border-radius:14px;padding:12px;font:inherit;text-align:left;display:flex;flex-direction:column;gap:6px}

        </button>
        <button class="k-kind" role="radio" aria-checked="false">
          <svg/>
          <span style="font-size: 15px; font-weight: 600">Loan or debt</span><span style="font-size: 12px; line-height: 16px; color: #6B6F76">Owed by me, or to me</span>

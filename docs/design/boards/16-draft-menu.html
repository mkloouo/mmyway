<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Draft menu</title>
<script src="29fbbbad-3110-48cb-9545-5b01ebabecae"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box;border:0;background:transparent;font:inherit;text-align:left;color:#14151A}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}
.k-val{font-size:15px;color:#6B6F76;white-space:nowrap}
.k-x{width:32px;height:32px;border-radius:50%;background:#E8E8E4;border:0;display:flex;align-items:center;justify-content:center;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #3A3A3C; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #F5F5F3; border-radius: 14px 14px 0 0; padding: 70px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="font-size: 44px; font-weight: 700">84,37 zł</div>
    <div style="width: 100%; height: 260px; border-radius: 14px; background: #fff; border: 1px solid #E3E3DF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.40)"></div>

  <div role="dialog" aria-label="Draft" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F5F3; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9C9C4; margin: 8px auto 0"></div>
    <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; gap: 12px">
      <span style="flex: 1; font-size: 17px; font-weight: 600">Draft</span>
      <button class="k-x" aria-label="Close"><svg/></button>
    </div>
    <div style="padding: 0 16px 34px; display: flex; flex-direction: column; gap: 24px">
      <div class="k-grp">
        <button class="k-row"><span class="k-lbl">Split into parts</span><svg/></button>
        <button class="k-row"><span class="k-lbl">Currency</span><span class="k-val">PLN</span><svg/></button>
        <button class="k-row"><span class="k-lbl">Replace receipt photo</span><svg/></button>
      </div>
      <div class="k-grp">
        <button class="k-row"><span class="k-lbl" style="color: #C2413A">Delete draft</span></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

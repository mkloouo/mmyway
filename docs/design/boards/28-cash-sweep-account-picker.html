<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cash sweep account picker</title>
<script src="44e72ae1-3243-48d3-a2cf-6d7ccbfcdf41"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:#E3E3DF}
.k-lbl{flex:1;font-size:15px;line-height:20px;color:#14151A}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76}
.k-sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#6B6F76;padding:16px 4px 8px;display:flex;justify-content:space-between}
.k-x{width:32px;height:32px;border-radius:50%;background:#E8E8E4;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.k-seg{display:flex;background:#E8E8E4;border-radius:10px;padding:2px}
.k-seg button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#6B6F76}
.k-seg button.on{background:#fff;color:#14151A;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.k-check{flex:none}
.k-hint{font-size:12px;color:#6B6F76;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #3A3A3C; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.40)"></div>

  <div role="dialog" aria-label="Missing cash goes to" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #F5F5F3; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9C9C4; margin: 8px auto 0"></div>
    <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Missing cash goes to</span><span class="k-sub">One of 612 expense accounts</span></div>
      <button class="k-x" aria-label="Close"><svg/></button>
    </div>

    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 12px; background: #E8E8E4; padding: 0 12px; box-shadow: inset 0 0 0 2px #4C5BD4">
        <svg/>
        <label for="cs-q" style="position: absolute; left: -9999px">Search expense accounts</label>
        <input id="cs-q" placeholder="Search by name" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none">
      </div>
      <div class="k-seg" role="group" aria-label="Which accounts"><button class="on" aria-pressed="true">Used this year · 84</button><button>All · 612</button></div>
    </div>

    <div style="padding: 0 16px; flex: 1; overflow: hidden; position: relative">
      <div class="k-sh"><span>Chosen</span></div>
      <div class="k-grp">
        <div class="k-row"><span class="k-lbl" style="font-weight: 600">Cash shortfall</span><svg/></div>
      </div>

      <div class="k-sh"><span>Looks right</span></div>
      <div class="k-grp">
        <div class="k-row"><span class="k-lbl">Reconciliation</span><span class="k-hint">name match</span></div>
        <div class="k-row"><span class="k-lbl">Cash lost</span><span class="k-hint">name match</span></div>
      </div>

      <div class="k-sh"><span>A</span><span style="text-transform: none; letter-spacing: 0">7</span></div>
      <div class="k-grp" style="margin-right: 18px">
        <div class="k-row"><span class="k-lbl">Aldi</span></div>
        <div class="k-row"><span class="k-lbl">Allegro</span></div>
        <div class="k-row"><span class="k-lbl">Apteka Gemini</span></div>
        <div class="k-row"><span class="k-lbl">Auchan</span></div>
      </div>

      <div style="position: absolute; right: 2px; top: 170px; display: flex; flex-direction: column; gap: 1px; font-size: 10px; font-weight: 700; color: #4C5BD4; text-align: center; line-height: 13px" aria-hidden="true">
        <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span><span>L</span><span>M</span><span>N</span><span>O</span><span>P</span><span>R</span><span>S</span><span>T</span><span>U</span><span>W</span><span>Z</span><span>Ż</span><span>#</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

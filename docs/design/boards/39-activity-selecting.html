<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Activity selecting</title>
<script src="941a5edb-fd44-4f07-87f8-18e36011cae8"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4C5BD4}a:hover{color:#3A48B8}
.k-grp{background:#FFFFFF;border:1px solid #E3E3DF;border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;box-sizing:border-box}
.k-row + .k-row::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:#E3E3DF}
.k-stack{flex:1;min-width:0;display:flex;flex-direction:column;padding:9px 0}
.k-lbl{font-size:15px;line-height:20px;color:#14151A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-sub{font-size:13px;line-height:17px;color:#6B6F76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#6B6F76;padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:baseline}
.k-sh span + span{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.k-tile{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.k-dot{width:8px;height:8px;border-radius:50%}
.k-tag{flex:none;font-size:11px;font-weight:600;letter-spacing:.4px;color:#8A4006;background:#FDF0DC;border-radius:999px;padding:3px 8px}
.k-c{height:32px;padding:0 12px;border-radius:999px;border:1px solid #E3E3DF;background:#fff;font:inherit;font-size:14px;color:#14151A;white-space:nowrap;flex:none}
.k-c.on{background:#4C5BD4;border-color:#4C5BD4;color:#fff;font-weight:600}
.k-bal{flex:none;width:132px;border:0;background:transparent;font:inherit;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;color:#14151A}
.k-bal + .k-bal{border-left:1px solid #E3E3DF}
.k-ibtn{width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.k-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#6B6F76;text-decoration:none;padding-top:7px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F5F3; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #14151A; position: relative; overflow: hidden">
  <div style="height: 54px"></div>

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px 0 4px; gap: 4px">
    <button style="border: 0; background: transparent; padding: 0 12px; height: 44px; font: inherit; font-size: 17px; color: #4C5BD4">Cancel</button>
    <span style="flex: 1; text-align: center; font-size: 17px; font-weight: 600">2 selected</span>
    <span style="width: 76px"></span>
  </div>
  <div class="k-sh"><span>Today</span><span>−104,37 zł</span></div>
  <div style="padding: 0 16px">
    <div class="k-grp">
      <div class="k-row">
        <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: #4C5BD4; display: flex; align-items: center; justify-content: center; flex: none"><svg/></span>
        <div class="k-stack"><span class="k-lbl">Lidl</span><span class="k-sub">2 splits · Groceries, Household</span></div>
        <span class="k-amt">−84,37 zł</span>
      </div>
      <div class="k-row">
        <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: #4C5BD4; display: flex; align-items: center; justify-content: center; flex: none"><svg/></span>
        <div class="k-stack"><span class="k-lbl">Coffee</span><span class="k-sub">Eating out · Costa</span></div>
        <span class="k-tag">QUEUED</span>
        <span class="k-amt">−20,00 zł</span>
      </div>
    </div>
  </div>
  <div class="k-sh"><span>Yesterday</span><span>+8.400,00 zł</span></div>
  <div style="padding: 0 16px">
    <div class="k-grp">
      <div class="k-row">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #C9C9C4; flex: none"></span>
        <div class="k-stack"><span class="k-lbl">Salary</span><span class="k-sub">Salary · Acme</span></div>
        <span class="k-amt" style="color: #2E8B57">+8.400,00 zł</span>
      </div>
      <div class="k-row">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #C9C9C4; flex: none"></span>
        <div class="k-stack"><span class="k-lbl">To savings</span><span class="k-sub">Checking → Savings EUR</span></div>
        <span class="k-amt" style="color: #3B82F6">1.000,00 zł</span>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #E3E3DF; padding: 12px 16px 34px; background: #F5F5F3">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #FBE9E7; color: #C2413A; font: inherit; font-size: 17px; font-weight: 600">Delete 2 transactions</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>

# Static analysis (docs/STATIC_ANALYSIS.md), beside ci.yml's typecheck, lint and tests. Each check
# is its own step so a failure names the check. Only expo-doctor and gitleaks warn.
name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import cycles that exist at runtime
        run: npm run analyze:cycles
      - name: Copy-paste over 1%
        run: npm run analyze:dupes
      - name: High or critical advisories in the app's dependencies
        run: npm run analyze:deps
      - name: Unused files, exports and dependencies
        run: npm run analyze:dead
      - name: Expo config and SDK package versions (warns only)
        run: npm run analyze:doctor
        continue-on-error: true # a patch behind the SDK is Dependabot's to open, not a red build
      - name: Secrets in the history (gitleaks, warns only)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

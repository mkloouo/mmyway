# Static analysis (docs/STATIC_ANALYSIS.md), beside ci.yml's typecheck, lint and tests. Each check
# is its own step so a failure names the check. Only gitleaks warns.
name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import cycles that exist at runtime
        run: pnpm run analyze:cycles
      - name: Copy-paste over 1%
        run: pnpm run analyze:dupes
      - name: High or critical advisories in the app's dependencies
        run: pnpm run analyze:deps
      - name: Unused files, exports and dependencies
        run: pnpm run analyze:dead
      - name: Expo config and SDK package versions
        run: pnpm run analyze:doctor
      - name: Secrets in the history (gitleaks, warns only)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

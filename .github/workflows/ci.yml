# Typecheck, lint and test on every push and pull request (review: "nothing checks a push").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # expo-router writes its route types (.expo/types, expo-env.d.ts) when the dev server
      # starts; there is no standalone command, so start it briefly. Without them typed routes
      # silently fall back to plain strings.
      - name: Generate typed routes
        run: CI=1 timeout 90 pnpm exec expo start --offline || true
      - run: test -f .expo/types/router.d.ts
      - run: pnpm exec prettier --check .
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:coverage

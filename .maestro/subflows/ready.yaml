appId: ${APP_ID}
---
# Brings the app to the Inbox, signed in to the test instance and freshly synced.
# Every flow starts here, so a flow can also run on its own (`npm run e2e -- S4`).
- launchApp:
    appId: ${APP_ID}
- runFlow:
    when:
      visible: 'Allow|ALLOW|While using the app'
    commands:
      - tapOn: 'Allow|ALLOW|While using the app'
- extendedWaitUntil:
    visible: 'Inbox, tab, 1 of 5'
    timeout: 30000
- runFlow:
    when:
      visible: 'Connect Firefly III|Go to Settings'
    file: sign-in.yaml
    env:
      FLAGS: '${typeof FLAGS != "undefined" ? FLAGS : ""}'
- runFlow:
    when:
      true: '${typeof FLAGS != "undefined" && FLAGS != ""}'
      notVisible: 'Connect Firefly III|Go to Settings'
    commands:
      - openLink: 'mmyway-dev://e2e-sign-in?flags=${encodeURIComponent(FLAGS)}'
      - extendedWaitUntil:
          visible: 'Connected to Firefly III'
          timeout: 15000
      - tapOn: 'Done'
      - tapOn: 'Inbox, tab, 1 of 5'
- runFlow: sync.yaml

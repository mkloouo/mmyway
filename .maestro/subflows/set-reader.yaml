appId: ${APP_ID}
---
# Configures a receipt reader from the runner's env: GEMINI_KEY, or LOCAL_MODEL_URL +
# LOCAL_MODEL_NAME (an OpenAI-compatible server the phone can reach). Pass both as "" to skip.
# Both live on Settings → Receipt reading.
- runFlow: home.yaml
- tapOn: 'Settings, tab, 5 of 5'
- tapOn: 'Receipt reading'
- runFlow:
    when:
      true: ${GEMINI_KEY != ''}
    commands:
      - tapOn: 'API key'
      - tapOn: 'API key'
      - inputText: ${GEMINI_KEY}
      - tapOn: 'Save'
- runFlow:
    when:
      true: ${LOCAL_MODEL_URL != ''}
    commands:
      - tapOn: 'Model name'
      - tapOn: 'e.g. qwen3-vl-8b'
      - inputText: ${LOCAL_MODEL_NAME}
      - tapOn: 'Save'
      - tapOn: 'Where it runs'
      - tapOn: 'https://…'
      - inputText: ${LOCAL_MODEL_URL}
      - tapOn: "\\+ Add address"
      # Closes the address sheet.
      - back
# Back from Receipt reading to Settings.
- back
- tapOn: 'Inbox, tab, 1 of 5'

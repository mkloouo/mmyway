appId: ${APP_ID}
name: 'B1 · Budget: create, rename, delete an envelope'
tags:
  - release
---
# An envelope is a Firefly III budget. Created from the Budget tab's + (a sheet), renamed in the
# name field on its own page, deleted from its ••• menu. Each change goes through the outbox, so
# every step syncs and then checks Firefly III.
- runFlow: ../../subflows/ready.yaml

# Create: the + opens the New envelope sheet; its name field has a placeholder.
- tapOn: 'Budget, tab, 4 of 5'
- tapOn: 'New envelope'
- tapOn: 'e.g. Groceries, Rent'
- inputText: 'E2E Env'
- hideKeyboard
- tapOn: 'Create envelope'
# The confirm dialog's Create. Its title is "New envelope", as is the screen's, so pick the button
# that sits below the dialog title.
- tapOn:
    text: 'Create'
    below: 'New envelope'
- runFlow: ../../subflows/sync.yaml
- runScript:
    file: ../../scripts/ff3.js
    env: { ACTION: expectBudget, NAME: 'E2E Env', TIMEOUT_MS: '90000' }

# Rename: the envelope page's name field (testID envelope-name) shows a Save bar on change; Save asks
# to confirm, and the dialog's Rename is the button below its title.
- tapOn: 'Budget, tab, 4 of 5'
- tapOn: 'E2E Env'
- tapOn:
    id: 'envelope-name'
- eraseText: 7
- inputText: 'E2E Env2'
- hideKeyboard
- tapOn: 'Save'
- tapOn:
    text: 'Rename'
    below: 'Rename to "E2E Env2"\?'
- runFlow: ../../subflows/home.yaml
- runFlow: ../../subflows/sync.yaml
- runScript:
    file: ../../scripts/ff3.js
    env: { ACTION: expectBudget, NAME: 'E2E Env2', TIMEOUT_MS: '90000' }
- runScript:
    file: ../../scripts/ff3.js
    env: { ACTION: expectNoBudget, NAME: 'E2E Env', TIMEOUT_MS: '90000' }

# Delete: the ••• (labelled More) opens a menu with Delete; the confirm dialog's Delete is the button
# below its title.
- tapOn: 'Budget, tab, 4 of 5'
- tapOn: 'E2E Env2'
- tapOn: 'More'
- tapOn: 'Delete'
- tapOn:
    text: 'Delete'
    below: 'Delete "E2E Env2"\?'
- runFlow: ../../subflows/sync.yaml
- runScript:
    file: ../../scripts/ff3.js
    env: { ACTION: expectNoBudget, NAME: 'E2E Env2', TIMEOUT_MS: '90000' }

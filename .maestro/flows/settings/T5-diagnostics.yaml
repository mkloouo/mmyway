appId: ${APP_ID}
name: 'T5 · Diagnostics log'
tags:
  - release
  - host
---
# Settings → Diagnostics → Share opens the share sheet. The runner then reads the log file over
# adb and fails the run if it contains the API token or a key.
- runFlow: ../../subflows/ready.yaml
- tapOn: 'Settings, tab, 5 of 5'
- scrollUntilVisible:
    element:
      text: 'About and help'
    direction: DOWN
- tapOn: 'About and help'
- tapOn: 'Activity log'
- runFlow:
    when:
      visible: 'Share'
    commands:
      - tapOn: 'Share'
      - takeScreenshot: T5-share-sheet
      - back
- runFlow: ../../subflows/home.yaml
